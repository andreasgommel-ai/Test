<title>Stimmapparat im Film</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Bewusst dunkel wie ein Vorführraum; Farben stammen aus dem Stimmapparat-Modell. */
:root{
  color-scheme:dark;
  --bg:#0B1113; --surface:#141C1F; --line:#26323A; --ink:#E3EBE9; --muted:#93A29E;
  --c1:#78B4F5; --c2:#F07CA2; --c3:#EBB052; --c4:#57CDA7;
  --f-d:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif; --f-b:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif; --f-m:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 32px;display:grid;gap:16px}
h1{font-family:var(--f-d);font-size:clamp(1.6rem,3vw,2.3rem);line-height:1.05;margin:0;letter-spacing:-.01em}
.lead{margin:.3rem 0 0;color:var(--muted);max-width:70ch}
.player{background:#000;border:1px solid var(--line);border-radius:12px;overflow:hidden;aspect-ratio:16/9;max-width:100%}
video{display:block;width:100%;height:100%;background:#000}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--f-m);font-size:12px;padding:4px 9px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}
.chapters{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ch{appearance:none;cursor:pointer;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 12px;color:var(--ink);font:inherit;display:grid;gap:2px}
.ch:hover{border-color:var(--cc)}
.ch[aria-current="true"]{border-color:var(--cc);box-shadow:inset 3px 0 0 var(--cc)}
.ch time{font-family:var(--f-m);font-size:12px;color:var(--muted)}
.ch b{font-family:var(--f-d);font-size:15px}
:focus-visible{outline:2px solid var(--c1);outline-offset:2px}
.note{font-size:13px;color:var(--muted);margin:0;max-width:90ch}
.err{padding:20px;color:var(--ink)}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{appearance:none;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;color:var(--ink);font:inherit;display:grid;text-align:left}
.tab b{font-family:var(--f-d);font-size:16px}
.tab small{color:var(--muted);font-size:12.5px}
.tab[aria-selected="true"]{border-color:var(--c3);box-shadow:inset 0 -3px 0 var(--c3)}
</style>

<div class="wrap">
  <header>
    <h1>Der Stimmapparat im Film</h1>
    <p class="lead">Zwei Erklärvideos für Trainings: wie aus Atemluft Ton, Stimme und Sprache werden. Mit Sprecher, Hörbeispielen und Untertiteln im Bild.</p>
  </header>
  <div class="tabs" role="tablist" aria-label="Video wählen" id="tabs"></div>
  <div class="player">
    <video id="vid" controls playsinline preload="metadata"></video>
  </div>
  <div class="meta" id="meta"></div>
  <nav class="chapters" id="chapters" aria-label="Kapitel"></nav>
  <p class="note" id="note"></p>
</div>

<script>
(() => {
  const VIDEOS = [
    { id: 'erklaervideo', title: 'Erklärvideo', sub: '3D-Modell · 6:30 min', src: '/_blob/a35dcc73c8a7351ce4e4a239e8091877',
      chips: ['6:30 min', 'Sprecher: Thorsten (synthetisch)', 'Untertitel im Bild', 'Webfassung 720p'],
      note: 'Atmung, Kehlkopf, Stimmlippen, Resonanz und Artikulation am anatomischen 3D-Modell. Kapitel anklicken springt an die Stelle.',
      ch: [['Einführung', 0, '--muted'], ['1 Atmung', 32.1, '--c1'], ['2 Kehlkopf', 86.8, '--c2'], ['3 Stimmlippen', 134.3, '--c2'], ['4 Resonanz', 216.4, '--c3'], ['5 Artikulation', 291.4, '--c4'], ['Zusammenfassung', 357.8, '--muted']] },
    { id: 'bausteine', title: 'Stimme aus Bausteinen', sub: 'Klemmbaustein-Modell · 1:55 min', src: 'BRICK_SRC',
      chips: ['1:55 min', 'Sprecher: Thorsten, lebhaft (synthetisch)', 'Untertitel im Bild', '1080p'],
      note: 'Der Stimmapparat Stein für Stein gebaut, in vier Bauschritten wie in einer Bauanleitung. Kapitel anklicken springt an die Stelle.',
      ch: [['Start', 0, '--muted'], ['1 Atmung', 12.5, '--c1'], ['2 Kehlkopf', 32.0, '--c2'], ['3 Ansatzrohr', 58.5, '--c3'], ['4 Artikulation', 71.9, '--c4'], ['Fertig', 102.6, '--muted']] }
  ].filter(v => !v.src.includes('_SRC'));
  const v = document.getElementById('vid'), nav = document.getElementById('chapters'), tabs = document.getElementById('tabs');
  const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  let cur = null, btns = [];
  function show(id) {
    cur = VIDEOS.find(x => x.id === id) || VIDEOS[0];
    [...tabs.children].forEach(t => t.setAttribute('aria-selected', String(t.dataset.id === cur.id)));
    v.src = cur.src; v.load();
    document.getElementById('meta').innerHTML = cur.chips.map(c => `<span class="chip"></span>`).join('');
    [...document.getElementById('meta').children].forEach((el, i) => { el.textContent = cur.chips[i]; });
    document.getElementById('note').textContent = cur.note;
    nav.innerHTML = '';
    btns = cur.ch.map(([name, t, c]) => {
      const b = document.createElement('button'); b.type = 'button'; b.className = 'ch'; b.style.setProperty('--cc', `var(${c})`);
      b.innerHTML = `<time>${fmt(t)}</time><b></b>`; b.querySelector('b').textContent = name;
      b.addEventListener('click', () => { v.currentTime = t + .05; v.play().catch(() => {}); });
      nav.appendChild(b); return b;
    });
  }
  VIDEOS.forEach(x => {
    const t = document.createElement('button'); t.type = 'button'; t.className = 'tab'; t.setAttribute('role', 'tab'); t.dataset.id = x.id;
    t.innerHTML = '<b></b><small></small>'; t.querySelector('b').textContent = x.title; t.querySelector('small').textContent = x.sub;
    t.addEventListener('click', () => show(x.id)); tabs.appendChild(t);
  });
  tabs.hidden = VIDEOS.length < 2;
  v.addEventListener('timeupdate', () => {
    let i = 0; cur.ch.forEach((c, k) => { if (v.currentTime >= c[1]) i = k; });
    btns.forEach((b, k) => b.setAttribute('aria-current', String(k === i)));
  });
  v.addEventListener('error', () => { document.getElementById('note').textContent = 'Das Video konnte nicht geladen werden. Bitte die Seite neu laden.'; });
  show(location.hash.slice(1));
})();
</script>
